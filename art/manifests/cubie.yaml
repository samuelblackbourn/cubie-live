# Cubie's sprite sheets (art/cubie/): the base character, final (art-02). Drawn in code
# from model O (art/src/cubie/model.mjs) by art/src/cubie/build.mjs — the build is
# the source of truth; re-run it, never touch up a PNG. PixelLab is not used for
# Cubie (ruling 60, 2026-11-13, reversing decision 20 for Cubie only).
# Overlays per clip: <clip>.<tint|back|held|status|front>.<name>.png (+ _emissive when
# it glows). `worn` overlays show only when his state says so (packs, wet, a carried
# tool); the rest always ride the clip.
